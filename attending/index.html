  renderVals() {
    // Replace with the Garza Blanca room block link when you have it.

    const t = this.copy();
    const done = this.state.done;
    const isEs = this.state.lang === 'es';
    const steps = t.steps.map((s, i) => {
      const d = !!done[i];
      return {
        ...s,
        n: i + 1,
        done: d, notDone: !d,
        pressed: String(d),
        aria: (d ? t.unmark : t.mark) + ': ' + s.title,
        toggle: () => this.setState({ done: { ...this.state.done, [i]: !this.state.done[i] } }),
        bg: d ? '#EFE6D6' : '#FFFFFF',
        checkBg: d ? '#0E3B4A' : 'transparent',
        checkFg: d ? '#F7F2EA' : '#0E3B4A',
        strike: d ? 'line-through' : 'none',
        cbxLabel: d ? t.doneLabel : t.markLabel, cbxFg: d ? '#3B5537' : '#0E3B4A', tickOp: d ? '1' : '0',
        hasDue: !!s.due, hasNote: !!s.note,
        isSong: !!s.song && !this.state.song, songSet: !!s.song && !!this.state.song,
        hasLinks: !!(s.links && s.links.length),
        links: (s.links || []).map((l) => ({
          label: l.label,
          cls: l.primary ? 'btn' : 'btn-ghost',
          bg: l.primary ? '#0E3B4A' : 'transparent',
          fg: l.primary ? '#F7F2EA' : '#0E3B4A',
          open: (e) => this.openBk(e)
        }))
      };
    });
    const doneCount = steps.filter((s) => s.done).length;
    const b = {
      ...t.bk,
      dates: t.bk.dates.map((d, i, a) => ({ ...d, line: i === a.length - 1 ? 'transparent' : 'rgba(14,59,74,.1)' })),
      hotels: t.bk.hotels.map((h) => ({ ...h, bg: h.kids ? '#DDE6D5' : '#0E3B4A', fg: h.kids ? '#24432A' : '#F7F2EA' })),
      change: t.bk.change.map((c, i) => ({ ...c, dot: i === 0 ? '#F7F2EA' : '#0E3B4A' }))
    };
    return {
      t, steps, b,
      bkOpen: this.state.bk,
      bookUrl: BOOKING_URL,
      bkClose: () => this.closeBk(),
      bkBackdrop: (e) => { if (e.target === e.currentTarget) this.closeBk(); },
