    const yes = kind === 'yes';
    const hearts = ['#D9637A', '#E88B9B', '#C2445E', '#F2B5C0', '#E06C84', '#2F6F84'];
    const faces = ['#EBCB7A', '#E9D49C', '#DDE6D5'];

      const size = yes ? rnd(16, 40) : rnd(26, 44);

        heart: yes, sad: !yes,
        x: x + 'px', y: y + 'px', size: size.toFixed(0) + 'px',
        dx: (yes ? rnd(-0.55, 0.55) * W : rnd(-0.32, 0.32) * W).toFixed(0) + 'px',
